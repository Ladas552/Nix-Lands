# tack pins. edit by hand or with tack add / rm / alias
# nix reads pins.lock.json; this file drives tack update

# shorturl schemes. scheme:rest expands rest into {path}
[shorturls]
gh = "github:{path}" # github
cb = "git+https://codeberg.org/{path}" # codeberg
td = "git+https://tangled.org/{path}" # tangled
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
local = "path:/home/ladas552/Projects/forks/{path}"

# all_follow: input name -> top-level pin it follows wherever it appears
# opt out per-input with exclude_follow
[all_follow]
# no deduplication
nixpkgs = ["nixpkgs", "nixpkgs-lib"]
systems = "systems"
hjem = "hjem"
flake-parts = "flake-parts"

flake-compat = "flake-compat"
flake-utils  = "flake-utils"
nix-darwin   = "nix-darwin"
adios = "adios"

# [inputs.<name>] fields
#   url             required, shorturl ok; ?rev=<sha> pins an exact commit
#   flake           default true; false exposes the source path
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules

[inputs]
# nixpkgs links
nixpkgs.url = "nixpkgs:nixos-unstable"
# nixpkgs.url = "gh:Nixos/nixpkgs/nixos-unstable"

# Hjem, another home-manager
hjem.url = "gh:feel-co/hjem"

# Modules for hjem
hjem-rum.url = "gh:snugnug/hjem-rum"

# Neovim
nvf.url = "gh:notashelf/nvf"

# Niri
niri.url = "cb:BANanaD3V/niri-nix"

# Tanled, git hosting
tangled.url = "td:tangled.org/core"

# Boilerplate
systems.url = "gh:nix-systems/default-linux"

# Highly experimental replacement to nixos stage scripts
nixos-core.url = "gh:manic-systems/nixos-core/notashelf/push-kzsvuxrxwpuq"

# Alternative pinning
tack.url = "gh:manic-systems/tack"

# Other NixOS modules
sops-nix.url = "gh:Mic92/sops-nix"

nixos-wsl.url = "gh:nix-community/NixOS-WSL"

noctalia = {url = "gh:noctalia-dev/noctalia", exclude_follow  = ["nixpkgs"]}

nixos-hardware.url = "gh:nixos/nixos-hardware"

nix-minecraft.url = "gh:Infinidoge/nix-minecraft"

copyparty.url = "gh:9001/copyparty"

mtv.url = "gh:fzakaria/nixpkgs-multiverse"

# adios galore
adios.url = "gh:llakala/lladios"

adios-wrappers.url = "gh:llakala/adios-wrappers"
# adios-wrappers.url = "local:adios-wrappers"

nvim.url = "gh:nix-community/neovim-nightly-overlay"
